name: Hermes Ad-hoc Build

on:
  push:
    branches: [feat/hermes-island, 'codex/hermes-*']
  pull_request:
    paths: ['boringNotch/**', 'Packages/IslandCore/**', 'boringNotch.xcodeproj/**', '.github/workflows/build-adhoc.yml', '.github/scripts/**', 'Shared/**', 'BoringNotchXPCHelper/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-adhoc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks
      - name: Verify Chinese resources and packaging invariants
        run: |
          python3 .github/scripts/check_chinese_localization.py
          python3 -m unittest discover -s .github/scripts/tests -q
      - name: Verify isolated core
        run: |
          swift run --package-path Packages/IslandCore -c release IslandCoreChecks
          python3 .github/scripts/test_island_stream.py
      - name: Verify submitted Hermes messages and draft lifecycle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python3 .github/scripts/test_hermes_submission.py 2>&1 | tee build/hermes-submission-report.txt
      - name: Verify paste sequencing without accessing the clipboard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python3 .github/scripts/test_clipboard_paste.py 2>&1 | tee build/clipboard-paste-report.txt
      - name: Verify native clipboard XPC and targeted event transport
        run: python3 .github/scripts/test_clipboard_native_event.py
      - name: Verify native window resizing without displaying UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python3 .github/scripts/test_window_layout.py 2>&1 | tee build/window-layout-report.txt
      - name: Verify actual AppKit display cycles in offscreen windows
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/test_ordered_window_layout.py 2>&1 | tee build/window-display-cycle-report.txt
      - name: Verify workspace expansion from the notch origin
        run: python3 .github/scripts/test_workspace_animation.py
      - name: Build ARM64 application without certificate secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild build \
            -project boringNotch.xcodeproj -scheme boringNotch \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES MACOSX_DEPLOYMENT_TARGET=27.0 \
            CODE_SIGN_IDENTITY='-' CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM='' \
            2>&1 | tee build/xcodebuild.log
      - name: Verify native Hermes Markdown and math rendering
        run: python3 .github/scripts/test_hermes_math_rendering.py
      - name: Sign and verify nested components
        run: |
          cp THIRD_PARTY_LICENSES 'build/DerivedData/Build/Products/Release/Boring Notch.app/Contents/Resources/THIRD_PARTY_LICENSES'
          python3 .github/scripts/sign_adhoc.py 'build/DerivedData/Build/Products/Release/Boring Notch.app'
      - name: Launch signed application and verify XPC without prompting for permissions
        run: python3 .github/scripts/smoke_adhoc.py 'build/DerivedData/Build/Products/Release/Boring Notch.app'
      - name: Create and verify drag-to-Applications DMG
        run: bash .github/scripts/create_adhoc_dmg.sh 'build/DerivedData/Build/Products/Release/Boring Notch.app' 'build/Boring Notch.dmg'
      - name: Package executable app
        shell: bash
        run: |
          set -euo pipefail
          APP='build/DerivedData/Build/Products/Release/Boring Notch.app'
          test -x "$APP/Contents/MacOS/Boring Notch"
          ditto -c -k --sequesterRsrc --keepParent "$APP" 'build/Boring Notch.app.zip'
          shasum -a 256 'build/Boring Notch.app.zip' 'build/Boring Notch.dmg' > build/SHA256SUMS
          git rev-parse HEAD > build/COMMIT_SHA
          {
            echo '## Hermes ARM64 Ad-hoc build'
            echo "Commit: $(git rev-parse HEAD)"
            cat build/SHA256SUMS
            echo 'Hermes is configured in Settings; calendar and reminders use macOS EventKit. Clipboard recording is opt-in.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload application and verification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Boring-Notch-Hermes-arm64-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/Boring Notch.app.zip
            build/Boring Notch.dmg
            build/SHA256SUMS
            build/COMMIT_SHA
            build/signing-report.txt
            build/startup-report.txt
            build/window-layout-report.txt
            build/window-display-cycle-report.txt
            build/workspace-animation-report.txt
            build/ordered-window-checks/
            build/clipboard-paste-report.txt
            build/hermes-markdown-report.txt
            build/hermes-submission-report.txt
            build/clipboard-native-checks/
            build/workspace-animation-frames/
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Hermes-build-diagnostics-${{ github.sha }}
          path: |
            build/xcodebuild.log
            build/startup-report.txt
            build/window-layout-report.txt
            build/window-display-cycle-report.txt
            build/workspace-animation-report.txt
            build/ordered-window-checks/
            build/clipboard-paste-report.txt
            build/hermes-markdown-report.txt
            build/hermes-submission-report.txt
            build/clipboard-native-checks/
            build/workspace-animation-frames/
          if-no-files-found: ignore
          # Keep the resolved dependency graph with diagnostics for reproducibility.
      - name: Upload resolved package versions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Hermes-resolved-packages-${{ github.sha }}
          path: boringNotch.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: ignore
